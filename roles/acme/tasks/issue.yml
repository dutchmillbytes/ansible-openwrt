---
# Obtain the certificate now, rather than waiting for the nightly cron.
#
# Restarting the acme service does NOT issue anything -- it only registers the
# `0 0 * * * /etc/init.d/acme renew` cron entry and prints "Nightly certificate
# renewal enabled". Without this step a freshly configured device has no
# certificate until midnight, and anything downstream (uhttpd) cannot be wired
# up in the same run.
#
# Guarded on the certificate being absent, so this is a one-time action per
# device; ongoing renewal is the cron's job.

- name: Check whether the certificate already exists
  ansible.builtin.stat:
    path: "{{ acme_issue_cert_path }}"
  register: acme_issue_stat

- name: Obtain the certificate
  when: not acme_issue_stat.stat.exists
  block:
    # Returns immediately; issuance runs in the background.
    - name: Trigger issuance
      ansible.builtin.command:
        cmd: "/etc/init.d/acme renew"
      changed_when: true

    # So the run has to wait for it, or the certificate is not there yet when
    # the next task wants to point a web server at it.
    - name: Wait for the certificate to appear
      ansible.builtin.command:
        cmd: >-
          /bin/sh -c 'n=0; while [ ! -f {{ acme_issue_cert_path }} ] &&
          [ $n -lt {{ acme_issue_timeout // 2 }} ]; do sleep 2; n=$((n+1)); done;
          [ -f {{ acme_issue_cert_path }} ]'
      register: acme_issue_wait
      failed_when: false
      changed_when: false

    - name: Report issuance failure
      ansible.builtin.assert:
        that: acme_issue_wait.rc == 0
        success_msg: "Certificate issued: {{ acme_issue_cert_path }}"
        fail_msg: >-
          No certificate after {{ acme_issue_timeout }}s. Check `logread -e acme`
          on the device -- common causes are the CA being unreachable, the root
          CA not trusted (see the ca-trust role), or the ACME server failing to
          reach this device on port 80 for the http-01 challenge.
