---
# Reload acme service
#
# Note this is not a no-op reload: starting the acme service is what triggers
# issuance and renewal, so a configuration change results in acme.sh talking
# to the CA. That is the intent, but it is why this is a handler rather than
# something run on every play.
- name: Reload acme
  ansible.builtin.service:
    name: "acme"
    state: "restarted"
    enabled: true

# Reload uhttpd service
- name: Reload uhttpd
  ansible.builtin.service:
    name: "uhttpd"
    state: "reloaded"
