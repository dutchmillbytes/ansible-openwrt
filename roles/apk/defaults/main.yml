---
# Package management for OpenWrt 24.10+, which replaced opkg with apk.
#
# The collection's other roles shell out to `opkg` and to the `opkg` Ansible
# module; neither exists on these releases. Use this role instead.

# Packages to install.
apk_packages: []

# Packages to remove.
apk_packages_absent: []

# Refresh the package index before installing. Only done when there is
# actually something to install -- `apk update` costs a few seconds and there
# is no point paying it on a run that changes nothing.
apk_update_cache: true
